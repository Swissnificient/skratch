<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Skratch</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Skratch</h1>
      <p>Public lead extractor</p>
    </header>

    <div class="actions">
      <button id="page" type="button">Scrape Page</button>
      <button id="maps" type="button">Scrape Google Maps</button>
      <button id="cancel" type="button" class="secondary" hidden>Cancel Enrichment</button>
      <button id="export" type="button" class="secondary">Export CSV</button>
      <button id="clear" type="button" class="danger">Clear Data</button>
    </div>

    <p id="status" role="status" aria-live="polite"></p>
    <div id="results" aria-label="Saved leads"></div>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
